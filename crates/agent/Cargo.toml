[package]
name = "streamphone-agent"
version = "1.2.1"
license = "MIT"
edition = "2021"
description = "StreamPhone desktop agent: serves the phone UI and executes actions on the PC"

[features]
default = ["https"]
# HTTPS for Discord's widget API. Its crypto library needs a C compiler for
# the target, so it can be left out (`--no-default-features`) where there is
# none; the Discord widget then reports Discord as unreachable.
https = ["dep:ureq"]

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
dirs = "6"
futures-util = "0.3"
mime_guess = "2"
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
# The system's language, for the names in a fresh config and the tray menu.
sys-locale = "0.3"
# HTTPS, for Discord's public widget API.
ureq = { version = "2", features = ["json"], optional = true }
# Pairing phones over Wi-Fi: one-time codes, device secrets, the QR code.
getrandom = "0.2"
hmac = "0.12"
sha2 = "0.10"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "net", "signal", "fs"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
  "Foundation",
  "Media_Control",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_System_Shutdown",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
]
