[package]
name = "streamphone"
version = "1.2.0"
license = "MIT"
edition = "2021"
description = "StreamPhone for the desktop: the agent in a window, with a tray icon and an installer"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
streamphone-agent = { path = "../agent" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
